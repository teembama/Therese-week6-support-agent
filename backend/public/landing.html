<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RelayPay Support</title>
  <meta name="description" content="RelayPay support: talk to voice support, or sign in as staff.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="card" aria-labelledby="title">
    <header class="brand">
      <span class="logo" aria-hidden="true">R</span>
      <div>
        <h1 id="title">RelayPay support</h1>
        <p class="lede">How can we help today?</p>
      </div>
    </header>

    <nav class="landing-options" aria-label="Choose where to go">
      <a class="landing-option primary" href="/support">
        <strong>Customer support</strong>
        <span>Talk to RelayPay voice support in your browser.</span>
      </a>
      <a class="landing-option" href="/staff">
        <strong>Staff</strong>
        <span>Sign in to see raised tickets and scheduled callbacks.</span>
      </a>
    </nav>

    <p class="note">Voice calls use your microphone and last at most 4 minutes.</p>
  </main>
</body>
</html>
